[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ocr-module"
version = "0.1.0"
description = "Modular Optical Character Recognition (OCR) and Document Extraction Framework"
readme = "Readme.md"
requires-python = ">=3.10"
dependencies = [
    "pillow>=10.0.0",
    "numpy>=1.24.0",
    "opencv-python-headless>=4.8.0",
    "pytesseract>=0.3.10",
    "pydantic>=2.0.0",
]

[project.scripts]
ocr-module = "ocr_module.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
